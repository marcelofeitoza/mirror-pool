# mirror-pool workspace - off-chain (host) crates.
#
# The on-chain program at programs/mirror-pool is intentionally NOT a member of
# this workspace: it targets SBF (solana-cargo-build-sbf) and is its own
# workspace so `cargo build`/`cargo test` at the root never tries to compile a
# Solana entrypoint for the host. Build it with:
#   cargo build-sbf --manifest-path programs/mirror-pool/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/mirror-core",
    "crates/mirror-coordinator",
    "crates/mirror-cli",
    "crates/mirror-harness",
    "crates/mirror-behaviors",
    "crates/mirror-soak",
]
exclude = ["programs/mirror-pool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/mirror-pool"
authors = ["mirror-pool contributors"]

[workspace.dependencies]
mirror-core = { path = "crates/mirror-core" }
mirror-behaviors = { path = "crates/mirror-behaviors" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
