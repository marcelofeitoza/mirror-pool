[package]
name = "mirror-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types for mirror-pool: commitments, nullifiers, epochs, action classes, k-anonymity accounting, and the on-chain wire format."

[dependencies]
thiserror.workspace = true
serde.workspace = true
sha2.workspace = true
# Poseidon over BN254, circomlib-compatible. light-poseidon is the same
# implementation the Solana `sol_poseidon` syscall is built on, so the host
# (this crate) and the on-chain accumulator produce byte-identical hashes and
# both match the committed Groth16 circuit. Pinned inline (NOT via the root
# [workspace.dependencies]) per the crate's own dependency needs; light-poseidon
# 0.4 resolves ark-bn254 / ark-ff 0.5, matched here so the `Fr` types agree.
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"
# keccak256 for the value-note `extDataHash`. `sha3::Keccak256` is Ethereum-style
# Keccak-256 (original padding), byte-identical to `ethers.keccak256` used by the
# fixture generator and to the on-chain `sol_keccak256` / `solana-keccak-hasher`
# syscall, so host, circuit fixtures, and program agree. Pinned inline (like the
# ark/poseidon deps above); 0.10 matches the version already in the lockfile.
sha3 = "0.10"

[dev-dependencies]
serde_json.workspace = true
