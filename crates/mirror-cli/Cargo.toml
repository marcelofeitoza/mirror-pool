# mirror-cli: participant-side CLI (v1 deliverable 5 in docs/ROADMAP.md).
#
# Lets a reviewer drive the full commit/settle flow by hand against a live
# cluster (Surfpool/devnet): initialize a pool, commit into the current shared
# epoch (crowd path), escrow + commit for the ZK opt-in path, generate the
# Groth16 membership proof, and inspect pool/epoch status.
[package]
name = "mirror-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Participant CLI for mirror-pool: init a pool, commit an action into the current shared epoch, escrow + commit for the ZK opt-in path, produce Groth16 membership proofs, and inspect pool status."

[dependencies]
mirror-core.workspace = true
# The multi-party Groth16 phase-2 trusted-setup ceremony. The `ceremony`
# subcommands are a thin CLI over this crate; the ceremony math, the Schnorr proofs
# of knowledge, the SHA-256 transcript chain and the verifier all live there.
mirror-ceremony.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same hash family mirror-core uses for commitments. Here it only stretches a
# user-supplied seed into a 32-byte Secret (deterministic, so the flow is
# testable end to end); v2 replaces seeds with OS randomness + encrypted notes.
sha2.workspace = true
# Big-integer arithmetic for the Groth16 proof serialization: decimal <-> 32-byte
# big-endian field elements and the BN254 base-field G1 negation `prove` emits in
# the SettleZk `proof_a`. Public crate; no cryptography of its own.
num-bigint = "0.4"
# OS randomness for confidential-value note blindings, dummy-input keys, and the
# value-keygen wallet. Host-side only (the CLI never runs in the SBF program).
rand.workspace = true

# In-process, pure-Rust Groth16 proving for the membership circuit (no Node/snarkjs
# on the default `prove` path). `ark-circom` 0.5 loads the SAME circom build
# artifacts snarkjs uses (the compiled `.wasm` witness calculator, run in-process by
# the pure-Rust `wasmer` VM, and the `.zkey` proving key via `read_zkey`), builds the
# witness from typed Rust inputs, and `ark-groth16` produces a proof over
# `ark-bn254`. The proving key comes either from a `.zkey` or from a phase-2
# ceremony `.mpk`; the deployed membership verifying key (src/vk.rs) was exported
# from the ceremony key, so that is the one that produces landable membership
# proofs. Pinned to arkworks 0.5 to match mirror-core's
# light-poseidon 0.4 -> ark-bn254/ark-ff 0.5, so the `Fr`/`Fq` types agree repo-wide.
ark-circom = "0.5"
ark-groth16 = "0.5"
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-snark = "0.5"
# ark-circom's `wasmer-wasix` witness runtime constructs a WASI stdin handle that
# calls `tokio::runtime::Handle::current()`, so the witness calculation must run
# inside a Tokio runtime CONTEXT (no reactor driving needed - nothing reads stdin).
# We enter a lightweight current-thread runtime around the in-process proof.
tokio.workspace = true

# Split Solana client + transaction crates, pinned to the SAME majors the on-chain
# program and the sibling host crates link (solana-pubkey v4, solana-instruction
# v3, solana-keypair/signer v3, solana-rpc-client v4) so Pubkey / Instruction /
# AccountMeta / Keypair are ONE type set across the repo. `curve25519` gives the
# host build `Pubkey::find_program_address` for pool/epoch/nullifier PDA
# derivation. Kept local to this crate (not promoted into the workspace deps) so
# wiring the participant submitter never perturbs the other host crates.
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-instruction = "3"
solana-keypair = "3"
solana-signer = "3"
solana-hash = "4"
solana-message = "4"
solana-transaction = "4"
solana-commitment-config = "3"
# Blocking JSON-RPC client (no async runtime in the CLI); talks to the local
# Surfpool mainnet mirror at http://127.0.0.1:8899 by default.
solana-rpc-client = "4"

# The SAME on-chain Groth16 verifier the program embeds (programs/mirror-pool). Used
# in tests to prove the Rust-generated SettleZk proof bytes are accepted by the exact
# verifier + committed verifying key the program runs, and by
# `ceremony prove-check`, so a reviewer can run the real on-chain verifier over a
# proof made under a ceremony-produced key without writing any code.
groth16-solana = "0.2.0"
