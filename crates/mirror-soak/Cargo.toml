# mirror-soak: the automated end-to-end soak-test suite.
#
# Drives BOTH settlement paths (crowd PlainTransfer + ZK opt-in) and the
# adversarial cases against a LIVE local Surfpool validator (treated as a
# mainnet mirror), then verifies every effect on-chain and writes docs/PROOF.md.
#
# Run:  cargo run -p mirror-soak -- [--rpc-url ...] [--program-id ...]
#
# It uses the shipped participant CLI (`mirror-cli`) for the ZK deposit-commit
# and Groth16 `prove`, and the gasless coordinator library
# (`mirror-coordinator::RpcSettleSubmitter`) for the atomic crowd settlement, so
# the soak exercises the real components rather than reimplementing them.
[package]
name = "mirror-soak"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "End-to-end Surfpool soak suite for mirror-pool: crowd + ZK settlement paths, adversarial cases, and on-chain verification"

[dependencies]
mirror-core.workspace = true
mirror-behaviors.workspace = true
mirror-coordinator = { path = "../mirror-coordinator" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Solana client + transaction crates, pinned to the SAME majors the coordinator
# and the on-chain program link (solana-pubkey v4, solana-instruction v3, ...) so
# Pubkey / Instruction / Keypair are ONE type set across the repo.
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-instruction = "3"
solana-keypair = "3"
solana-signer = "3"
solana-hash = "4"
solana-message = "4"
solana-transaction = "4"
solana-commitment-config = "3"
solana-signature = "3"

# Transaction FORENSICS, used only by the funding soak. Proving "this fresh
# wallet's only inbound transfer came from the pool vault" needs the full
# signature history of an account plus each transaction's account keys and
# pre/post balances, which is more than the deliberately-tiny `SolanaClient`
# trait exposes. The coordinator's `RpcSolanaClient::inner()` hands over the
# underlying client for exactly this, so the soak names the same pinned 4.x
# client + status types rather than widening the mockable trait.
solana-rpc-client = "4"
solana-rpc-client-api = "4"
solana-transaction-status-client-types = "4"

# The scaffolding every soak binary shares: process spawning, funding, the two
# wire-format instruction builders, v0 submission, and the PASS/FAIL report. Each
# binary keeps its own assertions and prose; none of them re-declare this.
[lib]
name = "mirror_soak"
path = "src/lib.rs"

[[bin]]
name = "mirror-soak"
path = "src/main.rs"

# The confidential-VALUE soak (JoinSplit shield/transfer/unshield). Shares the
# crate's deps + the shipped mirror-cli, but is a separate binary so the
# behavioral soak (src/main.rs) stays untouched.
[[bin]]
name = "mirror-soak-value"
path = "src/bin/confidential.rs"

# The FUNDING-ROUND soak: participants shield, `fund-commit` emits a relay-signed
# unshield into a FRESH commit wallet, the coordinator's funding service ingests
# it, batches it to a round boundary, and releases it gaslessly. Asserts the
# funding-provenance property on-chain (the fresh wallet's only inbound edge is
# the pool vault, and the funding tx carries exactly one signature: the relay's).
[[bin]]
name = "mirror-soak-funding"
path = "src/bin/funding.rs"
