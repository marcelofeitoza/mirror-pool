# mirror-pool on-chain program (SBF target).
#
# This crate is deliberately a STANDALONE workspace: the empty [workspace]
# table below stops Cargo from attaching it to the host workspace at the repo
# root, so `cargo build` / `cargo test` there never try to compile a Solana
# entrypoint for the host target. Build this crate with:
#
#   cargo build-sbf --manifest-path programs/mirror-pool/Cargo.toml
#
# Because it is outside the host workspace it cannot use the root
# [workspace.dependencies] table; versions are pinned inline here.
[package]
name = "mirror-pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/mirror-pool"
description = "Shared-epoch behavioral anonymity pool: INIT_POOL / COMMIT / SETTLE_EPOCH program skeleton (Pinocchio)"

# Keep this crate out of the parent workspace (see header comment).
[workspace]

[lib]
# cdylib: the deployable .so produced by cargo build-sbf.
# lib: lets host-side tests (mollusk, program-test) link the processor directly.
crate-type = ["cdylib", "lib"]

[features]
default = []
# Disable the entrypoint symbols when this crate is linked as a library
# (unit tests, CPI clients) rather than deployed.
no-entrypoint = []

[dependencies]
# Zero-dependency Solana program framework. 0.10.x API: Address + AccountView.
# The `cpi` feature pulls in the invoke/invoke_signed helpers and the Signer /
# Seed types needed to create the pool / epoch / nullifier PDAs.
pinocchio = { version = "0.10", features = ["cpi"] }
# Allocation-free, syscall-backed logging (log! macro).
pinocchio-log = "0.5"
# System-program CPI helpers (CreateAccount, Transfer) used to create the
# program-owned PDAs and move the anti-Sybil entry fee / ZK escrow.
pinocchio-system = "0.5"
# On-chain Groth16 verifier for the ZK opt-in membership proof (SETTLE_ZK).
# Uses the Solana alt_bn128 syscalls (via solana-bn254); builds for SBF and
# verifies in < ~200k CU. Consumes the vendored VERIFYINGKEY in src/vk.rs.
groth16-solana = "0.2.0"

[dev-dependencies]
# In-process SVM test harness: loads the compiled .so and runs instructions
# against a mocked runtime (no validator). Tests build real transactions and
# assert account state + custom error codes.
mollusk-svm = "0.14"
# Split Solana crates pinned to the versions mollusk-svm 0.14 resolves, so the
# Pubkey / Account / Instruction / ProgramError types the tests build with are
# the same types mollusk's API expects (avoids duplicate-crate mismatches).
# `curve25519` gives the host build `Pubkey::find_program_address` (a syscall
# on-chain) so tests can derive the PDAs the program expects. These are
# dev-dependencies only: `cargo build-sbf` never compiles them, so the deployed
# .so stays lean.
solana-pubkey = { version = "4", features = ["curve25519"] }
solana-account = "4"
solana-instruction = "3"
solana-program-error = "3"
# Host-side reference Poseidon for the empty-root cross-check: recompute the
# circuit's zero ladder zeros[DEPTH] with light-poseidon and assert it equals
# the root the on-chain `sol_poseidon` accumulator writes at init_pool. Same
# implementation the syscall is built on, so agreement proves on-chain ==
# circuit. Dev-only: `cargo build-sbf` never compiles these into the .so.
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"

[lints.rust]
# pinocchio macros expand cfg(target_os = "solana") / cfg(target_arch = "bpf")
# inside this crate; declare them valid for check-cfg.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(target_os, values(\"solana\"))",
    "cfg(target_arch, values(\"bpf\"))",
] }
